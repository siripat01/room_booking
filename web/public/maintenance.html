<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance — Room Booking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      padding: 1.5rem;
    }
    .card {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    p {
      font-size: 0.95rem;
      color: #a3a3a3;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.35rem 0.85rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 9999px;
      font-size: 0.78rem;
      color: #737373;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>Under Maintenance</h1>
    <p>ระบบกำลังปิดปรับปรุงชั่วคราว<br />We'll be back soon.</p>
    <span class="badge">ROOM BOOKING SYSTEM</span>
  </div>
</body>
</html>
