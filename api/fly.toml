# Fly.io Configuration
app = "room-booking-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  BUN_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.alive]
      grace_period = "10s"
      interval = "30s"
      method = "GET"
      path = "/api/health"
      protocol = "http"
      timeout = "5s"
