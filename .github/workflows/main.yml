name: CI/CD

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_4ThSUjgueDC5IuesDOUDRQQ0
  VERCEL_PROJECT_ID: prj_K4hUnFuL38KMFRnEsuY3tk57II8F

jobs:
  backend-ci:
    name: Backend CI (API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: roomflow_ci
          POSTGRES_PASSWORD: roomflow_ci
          POSTGRES_DB: roomflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomflow_ci -d roomflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://roomflow_ci:roomflow_ci@localhost:5432/roomflow_ci
      TEST_DATABASE_URL: postgresql://roomflow_ci:roomflow_ci@localhost:5432/roomflow_ci
      NODE_ENV: test
      NOTIFICATIONS_DISABLED: "true"
      BETTER_AUTH_SECRET: roomflow-ci-only-secret-at-least-32-characters

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('api/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.14-

      - name: Install Dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: api
        run: bun run prisma generate

      - name: Lint Backend
        working-directory: api
        run: bun run lint

      - name: Validate Prisma Schema
        working-directory: api
        run: bun run prisma validate

      - name: Compile Full API Route Graph
        working-directory: api
        run: bun run test:routes

      - name: Validate Migrations on Fresh PostgreSQL
        working-directory: api
        run: bun run migrate

      - name: Check Migration Status
        working-directory: api
        run: bun run prisma migrate status

      - name: Run Backend Unit Tests
        working-directory: api
        run: bun run test:unit

      - name: Run PostgreSQL Integration Tests
        working-directory: api
        run: bun run test:integration

      - name: Type Check Backend
        working-directory: api
        run: bun run typecheck

  frontend-ci:
    name: Frontend CI (Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('api/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.14-

      - name: Install API Dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: api
        run: node node_modules/prisma/build/index.js generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Cache PNPM Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-11.0.9-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-11.0.9-

      - name: Install Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        working-directory: web
        run: pnpm run lint

      - name: Run Frontend Component Tests
        working-directory: web
        run: pnpm test

      - name: Type Check Frontend
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build Frontend
        working-directory: web
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}

  docker-build:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    needs: backend-ci

    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: roomflow_smoke
          POSTGRES_PASSWORD: roomflow_smoke
          POSTGRES_DB: roomflow_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomflow_smoke -d roomflow_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SMOKE_DATABASE_URL: postgresql://roomflow_smoke:roomflow_smoke@127.0.0.1:5432/roomflow_smoke

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          load: true
          tags: roomflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Migrations from Production Image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL="${SMOKE_DATABASE_URL}"
          -e NODE_ENV=test
          -e NOTIFICATIONS_DISABLED=true
          -e BETTER_AUTH_SECRET=roomflow-docker-smoke-secret-at-least-32-characters
          roomflow-api:ci bun run migrate

      - name: Start Production API Image
        run: >-
          docker run --detach --name roomflow-api-smoke --network host
          -e DATABASE_URL="${SMOKE_DATABASE_URL}"
          -e NODE_ENV=production
          -e NOTIFICATIONS_DISABLED=true
          -e BETTER_AUTH_SECRET=roomflow-docker-smoke-secret-at-least-32-characters
          -e BETTER_AUTH_URL=http://127.0.0.1:3000
          -e FRONTEND_URL=http://127.0.0.1:3001
          -e GOOGLE_CLIENT_ID=ci-smoke-client
          -e GOOGLE_CLIENT_SECRET=ci-smoke-secret
          -e APP_VERSION=ci-smoke
          roomflow-api:ci

      - name: Verify Production API Startup and Readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/roomflow-health.json; then
              grep '"status":"healthy"' /tmp/roomflow-health.json
              grep '"service":"roomflow-api"' /tmp/roomflow-health.json
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' roomflow-api-smoke)" != "true" ]; then
              echo "Production API container exited before becoming healthy"
              docker logs roomflow-api-smoke
              exit 1
            fi
            echo "Waiting for production API readiness (${attempt}/30)"
            sleep 1
          done
          echo "Production API did not become healthy within 30 seconds"
          docker logs roomflow-api-smoke
          exit 1

      - name: Show API Smoke Logs and Clean Up
        if: always()
        run: |
          docker logs roomflow-api-smoke || true
          docker rm --force roomflow-api-smoke || true

  deploy-backend:
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.76

      - name: Deploy to Fly.io
        working-directory: api
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify Fly Deployment Health
        run: >-
          curl --fail --silent --show-error
          --retry 12 --retry-delay 5 --retry-all-errors
          https://room-booking-api.fly.dev/api/health

  deploy-frontend-preview:
    name: Deploy Frontend Preview (Vercel)
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/development')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}

      - name: Deploy Preview to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  deploy-frontend-production:
    name: Deploy Frontend Production (Vercel)
    runs-on: ubuntu-latest
    needs: [frontend-ci, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}

      - name: Deploy Production to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
