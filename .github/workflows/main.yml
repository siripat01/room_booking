name: CI/CD

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_4ThSUjgueDC5IuesDOUDRQQ0
  VERCEL_PROJECT_ID: prj_K4hUnFuL38KMFRnEsuY3tk57II8F

jobs:
  backend-ci:
    name: Backend CI (API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: roomflow_ci
          POSTGRES_PASSWORD: roomflow_ci
          POSTGRES_DB: roomflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomflow_ci -d roomflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://roomflow_ci:roomflow_ci@localhost:5432/roomflow_ci
      TEST_DATABASE_URL: postgresql://roomflow_ci:roomflow_ci@localhost:5432/roomflow_ci
      NODE_ENV: test
      NOTIFICATIONS_DISABLED: "true"
      BETTER_AUTH_SECRET: roomflow-ci-only-secret-at-least-32-characters

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('api/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.14-

      - name: Install Dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: api
        run: bun run prisma generate

      - name: Validate Prisma Schema
        working-directory: api
        run: bun run prisma validate

      - name: Validate Migrations on Fresh PostgreSQL
        working-directory: api
        run: bun run migrate

      - name: Check Migration Status
        working-directory: api
        run: bun run prisma migrate status

      - name: Run Backend Unit Tests
        working-directory: api
        run: bun run test:unit

      - name: Run PostgreSQL Integration Tests
        working-directory: api
        run: bun run test:integration

      - name: Type Check Backend
        working-directory: api
        run: bun run typecheck

  frontend-ci:
    name: Frontend CI (Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('api/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.14-

      - name: Install API Dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: api
        run: node node_modules/prisma/build/index.js generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Cache PNPM Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-11.0.9-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-11.0.9-

      - name: Install Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type Check Frontend
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build Frontend
        working-directory: web
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}

  docker-build:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: roomflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.76

      - name: Deploy to Fly.io
        working-directory: api
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend-preview:
    name: Deploy Frontend Preview (Vercel)
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/development')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}

      - name: Deploy Preview to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  deploy-frontend-production:
    name: Deploy Frontend Production (Vercel)
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}

      - name: Deploy Production to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
